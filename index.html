<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Grid & Proportion Analyzer</title></head><body><div style="font-family:system-ui;padding:24px">Loading analyzer…</div><script>
Promise.all([
 fetch('https://raw.githubusercontent.com/rhzuccarelli/grid/4d2abebdf758c467d58860859747b29b28311e14/index.html').then(r=>r.text()),
 fetch('./png_patch.js').then(r=>r.text())
]).then(([base,patch])=>{
 const needle='window.addEventListener(\'resize\',resize);';
 if(!base.includes(needle)) throw new Error('Patch anchor not found');
 base=base.replace(needle,patch+'\n'+needle);
 document.open();document.write(base);document.close();
}).catch(e=>{document.body.innerHTML='<pre style="white-space:pre-wrap;font-family:system-ui;padding:24px">Could not load analyzer: '+e.message+'</pre>'});
</script></body></html>
