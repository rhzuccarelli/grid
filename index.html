<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Grid Analyzer</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#eef0f2;color:#171717}.app{display:grid;grid-template-columns:350px 1fr;height:100vh}.p{background:#fff;padding:16px;overflow:auto;border-right:1px solid #ddd}.g{border-top:1px solid #eee;margin-top:14px;padding-top:14px}h1{font-size:20px;margin:0}h2{font-size:12px;text-transform:uppercase;color:#666}label{display:block;font-size:13px;margin:7px 0}input,select,button{max-width:100%}input[type=number],select{width:100%;padding:7px}button{padding:8px 10px;border:1px solid #ccc;border-radius:8px;background:#fff;font-weight:650;cursor:pointer}.primary,.active{background:#111;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.w{position:relative;overflow:hidden;background:#dfe3e6}canvas{width:100%;height:100%;display:block;touch-action:none}.tb{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}.tb button{width:auto}.status{position:absolute;top:12px;right:12px;background:#fff;padding:7px 9px;border-radius:8px;font-size:12px}.small{font-size:12px;color:#666}.card{background:#fafafa;border:1px solid #e5e5e5;border-radius:8px;padding:9px;font-size:12px}.big{font-size:18px;font-weight:700}@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto 62vh;height:auto}.p{border-right:0;border-bottom:1px solid #ddd}}</style></head><body><div class="app"><aside class="p"><h1>Product Grid & Proportion Analyzer</h1><div class="small">Square-grid, dimensions, landmarks and edge-assisted analysis.</div><div class="g"><h2>Image</h2><input id="file" type="file" accept="image/*"><button id="demo">Load demo</button></div><div class="g"><h2>Edge Assist</h2><label><input id="edge" type="checkbox"> Enable edge snapping</label><label>Radius <span id="rv">20 px</span><input id="rad" type="range" min="4" max="60" value="20"></label><label>Sensitivity <span id="sv">35</span><input id="sens" type="range" min="5" max="100" value="35"></label></div><div class="g"><h2>Product limits</h2><button id="setSides" class="primary">Set 4 sides</button> <button id="resetSides">Reset</button></div><div class="g"><h2>Square grid</h2><select id="drive"><option value="cols">Columns</option><option value="rows">Rows</option><option value="cell">Cell px</option></select><div id="colsBox"><label>Columns<input id="cols" type="number" value="30"></label></div><div id="rowsBox" hidden><label>Rows<input id="rows" type="number" value="35"></label></div><div id="cellBox" hidden><label>Cell px<input id="cell" type="number" value="20"></label></div><label>Opacity<input id="opacity" type="range" min="10" max="100" value="65"></label><label><input id="centers" type="checkbox" checked> Center axes</label><label><input id="extend" type="checkbox"> Extend grid to full image</label></div><div class="g"><h2>Calibration</h2><select id="knownSide"><option value="width">Known width</option><option value="height">Known height</option></select><label>Dimension mm<input id="knownMM" type="number" step="0.1"></label></div><div class="g"><h2>Landmarks</h2><button id="undoMark">Undo</button> <button id="clearMark">Clear</button><div id="marks"></div></div><div class="g"><h2>Measure</h2><label><input id="snap" type="checkbox" checked> Snap to grid</label><button id="undoMeasure">Undo</button> <button id="clearMeasure">Clear</button><div id="measures"></div></div><div class="g"><h2>Analysis</h2><div class="card"><div>Aspect W:H</div><div id="ratio" class="big">—</div><div id="ratio2" class="small"></div><div>Grid</div><div id="grid" class="big">—</div><div>Dimensions</div><div id="dims" class="big">—</div></div></div><div class="g"><h2>Export</h2><button id="png" class="primary">Export annotated PNG</button> <button id="report">Export B5 report</button></div></aside><main class="w" id="w"><canvas id="c"></canvas><div class="tb"><button data-mode="pan" class="active">Pan</button><button data-mode="sides">Set 4 sides</button><button data-mode="landmark">Landmark</button><button data-mode="measure">Measure</button><button id="fit">Fit</button></div><div class="status" id="status">Load image</div></main></div><script>(()=>{const $=x=>document.getElementById(x),cv=$('c'),ctx=cv.getContext('2d'),ws=$('w');let img=null,bs=1,z=1,ix=0,iy=0,mode='pan',step=0,s={left:null,right:null,top:null,bottom:null},marks=[],meas=[],pending=null,drag=false,lx=0,ly=0,pix=null;function size(){let r=ws.getBoundingClientRect();return{w:r.width,h:r.height}}function resize(){let q=size(),d=devicePixelRatio||1;cv.width=q.w*d;cv.height=q.h*d;ctx.setTransform(d,0,0,d,0,0);draw()}function fit(){if(!img)return;let q=size();bs=Math.min(q.w/img.width,q.h/img.height)*.92;ix=(q.w-img.width*bs)/2;iy=(q.h-img.height*bs)/2;z=1;draw()}function i2s(x,y){let a=bs*z;return{x:ix+x*a,y:iy+y*a}}function s2i(x,y){let a=bs*z;return{x:(x-ix)/a,y:(y-iy)/a}}function ready(){return Object.values(s).every(v=>v!==null)}function rect(){if(!ready())return null;let l=Math.min(s.left,s.right),r=Math.max(s.left,s.right),t=Math.min(s.top,s.bottom),b=Math.max(s.top,s.bottom);return{x:l,y:t,w:r-l,h:b-t}}function gridSpec(){let r=rect();if(!r)return null;let d=$('drive').value,c,co,ro;if(d==='cols'){co=Math.max(1,+$('cols').value||1);c=r.w/co;ro=Math.round(r.h/c)}else if(d==='rows'){ro=Math.max(1,+$('rows').value||1);c=r.h/ro;co=Math.round(r.w/c)}else{c=Math.max(1,+$('cell').value||1);co=Math.round(r.w/c);ro=Math.round(r.h/c)}return{cell:c,cols:co,rows:ro}}function mm(){let r=rect(),g=gridSpec(),k=+$('knownMM').value;if(!r||!g||!k)return null;let p,w,h;if($('knownSide').value==='width'){p=k/r.w;w=k;h=r.h*p}else{p=k/r.h;h=k;w=r.w*p}return{p,w,h,cell:g.cell*p}}function frac(v,m=12){let b=[1,1,99];for(let d=1;d<=m;d++)for(let n=0;n<=m*2;n++){let e=Math.abs(v-n/d);if(e<b[2])b=[n,d,e]}return b[0]+'/'+b[1]}function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(m==='sides'){step=0;$('status').textContent='Click LEFT'}else $('status').textContent=m}function lum(x,y){if(!pix){let o=document.createElement('canvas');o.width=img.width;o.height=img.height;let c=o.getContext('2d',{willReadFrequently:true});c.drawImage(img,0,0);pix=c.getImageData(0,0,img.width,img.height).data}x=Math.max(1,Math.min(img.width-2,Math.round(x)));y=Math.max(1,Math.min(img.height-2,Math.round(y)));let i=(y*img.width+x)*4;return .2126*pix[i]+.7152*pix[i+1]+.0722*pix[i+2]}function edgeSnap(p,k){if(!$('edge').checked||!img)return p;let R=+$('rad').value,T=+$('sens').value,b={p,sc:T};if(k==='v')for(let d=-R;d<=R;d++){let x=p.x+d,sc=Math.abs(lum(x+1,p.y)-lum(x-1,p.y));if(sc>b.sc)b={p:{x,y:p.y},sc}}else if(k==='h')for(let d=-R;d<=R;d++){let y=p.y+d,sc=Math.abs(lum(p.x,y+1)-lum(p.x,y-1));if(sc>b.sc)b={p:{x:p.x,y},sc}}else for(let dy=-R;dy<=R;dy+=2)for(let dx=-R;dx<=R;dx+=2){let x=p.x+dx,y=p.y+dy,sc=Math.abs(lum(x+1,y)-lum(x-1,y))+Math.abs(lum(x,y+1)-lum(x,y-1));if(sc>b.sc)b={p:{x,y},sc}}return b.p}function snapGrid(p){let r=rect(),g=gridSpec();if(!r||!g)return p;return{x:r.x+Math.round((p.x-r.x)/g.cell)*g.cell,y:r.y+Math.round((p.y-r.y)/g.cell)*g.cell}}function draw(){let q=size();ctx.clearRect(0,0,q.w,q.h);ctx.fillStyle='#dfe3e6';ctx.fillRect(0,0,q.w,q.h);if(img){let a=bs*z;ctx.drawImage(img,ix,iy,img.width*a,img.height*a)}let r=rect(),g=gridSpec();if(r&&g){let a=i2s(r.x,r.y),b=i2s(r.x+r.w,r.y+r.h),cell=g.cell*bs*z;ctx.save();ctx.strokeStyle='#00a67d';ctx.globalAlpha=+$('opacity').value/100;if($('extend').checked&&img){let tl=i2s(0,0),br=i2s(img.width,img.height),sx=a.x;while(sx-cell>=tl.x)sx-=cell;let sy=a.y;while(sy-cell>=tl.y)sy-=cell;for(let x=sx;x<=br.x;x+=cell){ctx.beginPath();ctx.moveTo(x,tl.y);ctx.lineTo(x,br.y);ctx.stroke()}for(let y=sy;y<=br.y;y+=cell){ctx.beginPath();ctx.moveTo(tl.x,y);ctx.lineTo(br.x,y);ctx.stroke()}}else{for(let x=a.x;x<=b.x+.5;x+=cell){ctx.beginPath();ctx.moveTo(x,a.y);ctx.lineTo(x,b.y);ctx.stroke()}for(let y=a.y;y<=b.y+.5;y+=cell){ctx.beginPath();ctx.moveTo(a.x,y);ctx.lineTo(b.x,y);ctx.stroke()}}ctx.restore();ctx.strokeStyle='#1677ff';ctx.lineWidth=2;ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y)}if(img){let tl=i2s(0,0),br=i2s(img.width,img.height);[['left','v'],['right','v'],['top','h'],['bottom','h']].forEach(([n,k])=>{if(s[n]===null)return;ctx.save();ctx.strokeStyle='#1677ff';ctx.lineWidth=2;ctx.setLineDash(ready()?[]:[7,5]);if(k==='v'){let p=i2s(s[n],0);ctx.beginPath();ctx.moveTo(p.x,tl.y);ctx.lineTo(p.x,br.y);ctx.stroke()}else{let p=i2s(0,s[n]);ctx.beginPath();ctx.moveTo(tl.x,p.y);ctx.lineTo(br.x,p.y);ctx.stroke()}ctx.restore()})}marks.forEach((m,i)=>{let p=i2s(m.x,m.y);ctx.save();ctx.strokeStyle='#e5484d';ctx.setLineDash([5,4]);if(m.ax)ctx.beginPath(),ctx.moveTo(0,p.y),ctx.lineTo(q.w,p.y),ctx.stroke();if(m.ay)ctx.beginPath(),ctx.moveTo(p.x,0),ctx.lineTo(p.x,q.h),ctx.stroke();ctx.restore();ctx.fillStyle='#e5484d';ctx.beginPath();ctx.arc(p.x,p.y,6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(i+1,p.x-3,p.y+3)});meas.forEach(m=>{let a=i2s(m.a.x,m.a.y),b=i2s(m.b.x,m.b.y);ctx.strokeStyle='#7c3aed';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()});analysis()}function analysis(){let r=rect(),g=gridSpec(),m=mm();if(!r||!g)return;$('ratio').textContent=(r.w/r.h).toFixed(3)+':1';$('ratio2').textContent='H/W = '+(r.h/r.w).toFixed(3)+' · ≈ '+frac(r.w/r.h);$('grid').textContent=g.cols+' × '+g.rows+' · cell '+(m?m.cell.toFixed(2)+' mm':g.cell.toFixed(2)+' px');$('dims').textContent=m?m.w.toFixed(1)+' × '+m.h.toFixed(1)+' mm':'—';$('marks').innerHTML=marks.map((x,i)=>{let u=(x.x-r.x)/r.w,v=(x.y-r.y)/r.h;return `<div class=card>L${i+1}: ${(u*100).toFixed(1)}% W ≈ ${frac(u)} · ${(v*100).toFixed(1)}% H ≈ ${frac(v)}<br><label><input type=checkbox data-i=${i} data-a=ax ${x.ax?'checked':''}> X axis</label><label><input type=checkbox data-i=${i} data-a=ay ${x.ay?'checked':''}> Y axis</label></div>`}).join('');document.querySelectorAll('#marks input').forEach(x=>x.onchange=()=>{marks[+x.dataset.i][x.dataset.a]=x.checked;draw()});$('measures').innerHTML=meas.map((x,i)=>{let dx=x.b.x-x.a.x,dy=x.b.y-x.a.y,d=Math.hypot(dx,dy);return `<div class=card>M${i+1}: ${m?(d*m.p).toFixed(2)+' mm':d.toFixed(1)+' px'}</div>`}).join('')}function crop(){let r=rect(),g=gridSpec();if(!r||!g)return{x:0,y:0,w:img.width,h:img.height};let x1=r.x+Math.ceil(-r.x/g.cell)*g.cell,x2=r.x+Math.floor((img.width-r.x)/g.cell)*g.cell,y1=r.y+Math.ceil(-r.y/g.cell)*g.cell,y2=r.y+Math.floor((img.height-r.y)/g.cell)*g.cell;return{x:x1,y:y1,w:x2-x1,h:y2-y1}}function exportPNG(){if(!img||!ready())return alert('Define image and 4 sides first');let cr=crop(),r=rect(),g=gridSpec(),m=mm(),foot=180,out=document.createElement('canvas');out.width=cr.w;out.height=cr.h+foot;let c=out.getContext('2d');c.drawImage(img,cr.x,cr.y,cr.w,cr.h,0,0,cr.w,cr.h);c.strokeStyle='#00a67d';for(let x=r.x+Math.ceil((cr.x-r.x)/g.cell)*g.cell;x<=cr.x+cr.w;x+=g.cell){c.beginPath();c.moveTo(x-cr.x,0);c.lineTo(x-cr.x,cr.h);c.stroke()}for(let y=r.y+Math.ceil((cr.y-r.y)/g.cell)*g.cell;y<=cr.y+cr.h;y+=g.cell){c.beginPath();c.moveTo(0,y-cr.y);c.lineTo(cr.w,y-cr.y);c.stroke()}marks.forEach((a,i)=>{c.fillStyle='#e5484d';c.beginPath();c.arc(a.x-cr.x,a.y-cr.y,7,0,7);c.fill();c.fillStyle='#fff';c.fillText(i+1,a.x-cr.x-3,a.y-cr.y+3)});meas.forEach(a=>{c.strokeStyle='#7c3aed';c.beginPath();c.moveTo(a.a.x-cr.x,a.a.y-cr.y);c.lineTo(a.b.x-cr.x,a.b.y-cr.y);c.stroke()});c.fillStyle='#fff';c.fillRect(0,cr.h,cr.w,foot);c.fillStyle='#111';c.font='16px system-ui';let lines=[`Aspect W:H ${(r.w/r.h).toFixed(3)}:1`,`Grid ${g.cols} × ${g.rows}`];if(m)lines.push(`Product ${m.w.toFixed(1)} × ${m.h.toFixed(1)} mm`,`PNG crop ${(cr.w*m.p).toFixed(1)} × ${(cr.h*m.p).toFixed(1)} mm`,`Cell ${m.cell.toFixed(2)} mm`);lines.forEach((t,i)=>c.fillText(t,16,cr.h+28+i*24));out.toBlob(b=>{let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='product-grid-analysis.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)},'image/png')}function report(){if(!img||!ready())return alert('Define image and sides first');let r=rect(),g=gridSpec(),m=mm(),h=`<html><head><style>@page{size:176mm 250mm;margin:12mm}body{font:10pt system-ui}h1{font-size:18pt}table{width:100%;border-collapse:collapse}td,th{padding:4px;border-bottom:1px solid #ccc}</style></head><body><h1>Product Grid Analysis</h1><p>W:H ${(r.w/r.h).toFixed(3)}:1 · H/W ${(r.h/r.w).toFixed(3)}</p><p>Grid ${g.cols} × ${g.rows}${m?' · '+m.w.toFixed(1)+' × '+m.h.toFixed(1)+' mm':''}</p><table><tr><th>Landmark</th><th>Position</th></tr>${marks.map((x,i)=>`<tr><td>${i+1}</td><td>${(((x.x-r.x)/r.w)*100).toFixed(1)}% W · ${(((x.y-r.y)/r.h)*100).toFixed(1)}% H</td></tr>`).join('')}</table><script>print()<\/script></body></html>`;let u=URL.createObjectURL(new Blob([h],{type:'text/html'}));window.open(u,'_blank')}cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(mode==='pan'){drag=true;lx=e.clientX;ly=e.clientY;return}let p=s2i(x,y);if(mode==='sides'){if(step===0)p=edgeSnap(p,'v'),s.left=p.x,$('status').textContent='Click RIGHT';else if(step===1)p=edgeSnap(p,'v'),s.right=p.x,$('status').textContent='Click TOP';else if(step===2)p=edgeSnap(p,'h'),s.top=p.y,$('status').textContent='Click BOTTOM';else p=edgeSnap(p,'h'),s.bottom=p.y,$('status').textContent='Done';step++}else if(mode==='landmark'){p=edgeSnap(p,'f');marks.push({...p,ax:false,ay:false})}else if(mode==='measure'){p=edgeSnap(p,'f');if($('snap').checked)p=snapGrid(p);if(!pending)pending=p;else meas.push({a:pending,b:p}),pending=null}draw()});cv.addEventListener('pointermove',e=>{if(!drag)return;ix+=e.clientX-lx;iy+=e.clientY-ly;lx=e.clientX;ly=e.clientY;draw()});cv.addEventListener('pointerup',()=>drag=false);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('setSides').onclick=()=>setMode('sides');$('resetSides').onclick=()=>{s={left:null,right:null,top:null,bottom:null};setMode('sides');draw()};$('undoMark').onclick=()=>{marks.pop();draw()};$('clearMark').onclick=()=>{marks=[];draw()};$('undoMeasure').onclick=()=>{if(pending)pending=null;else meas.pop();draw()};$('clearMeasure').onclick=()=>{meas=[];pending=null;draw()};$('fit').onclick=fit;$('png').onclick=exportPNG;$('report').onclick=report;$('drive').onchange=()=>{let v=$('drive').value;$('colsBox').hidden=v!=='cols';$('rowsBox').hidden=v!=='rows';$('cellBox').hidden=v!=='cell';draw()};['cols','rows','cell','opacity','centers','extend','knownMM','knownSide'].forEach(id=>$(id).oninput=draw);$('rad').oninput=()=>rv.textContent=rad.value+' px';$('sens').oninput=()=>sv.textContent=sens.value;$('file').onchange=e=>{let f=e.target.files[0],u=URL.createObjectURL(f),n=new Image;n.onload=()=>{img=n;pix=null;URL.revokeObjectURL(u);s={left:null,right:null,top:null,bottom:null};marks=[];meas=[];fit();setMode('sides')};n.src=u};$('demo').onclick=()=>{let o=document.createElement('canvas');o.width=1000;o.height=700;let c=o.getContext('2d');c.fillStyle='#eee';c.fillRect(0,0,1000,700);c.fillStyle='#bbb';c.fillRect(150,170,700,360);c.fillStyle='#222';c.fillRect(190,210,620,280);let n=new Image;n.onload=()=>{img=n;pix=null;s={left:150,right:850,top:170,bottom:530};fit();draw()};n.src=o.toDataURL()};new ResizeObserver(resize).observe(ws);resize()})();</script></body></html>
